<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Bot Auto-Responder</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: #1e293b;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 500px;
            text-align: center;
        }
        h2 {
            color: #38bdf8;
            margin-bottom: 10px;
        }
        p { color: #94a3b8; font-size: 14px; margin-bottom: 20px; }
        
        input[type="text"] {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #475569;
            border-radius: 6px;
            background: #334155;
            color: #fff;
            box-sizing: border-box;
            font-size: 16px;
            outline: none;
        }
        input[type="text"]:focus { border-color: #38bdf8; }
        
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: 0.3s;
        }
        .start-btn { background: #10b981; color: white; }
        .start-btn:hover { background: #059669; }
        .stop-btn { background: #ef4444; color: white; display: none; }
        .stop-btn:hover { background: #dc2626; }
        
        #logArea {
            background: #000;
            color: #10b981;
            font-family: monospace;
            padding: 10px;
            border-radius: 6px;
            margin-top: 20px;
            height: 150px;
            overflow-y: auto;
            text-align: left;
            font-size: 12px;
            border: 1px solid #334155;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Bot Dashboard 🚀</h2>
    <p>Apna Telegram Bot Token enter karein aur bot ko start karein.</p>
    
    <input type="text" id="botToken" placeholder="Paste HTTP API Bot Token here..." autocomplete="off">
    
    <div class="btn-group">
        <button id="startBtn" class="start-btn" onclick="startBot()">Start Bot</button>
        <button id="stopBtn" class="stop-btn" onclick="stopBot()">Stop Bot</button>
    </div>

    <div id="logArea">System Ready. Waiting for token...</div>
</div>

<script>
    let isPolling = false;
    let updateId = 0;
    let botToken = "";

    // Exact user welcome message
    const welcomeMessage = `🚀 ✨ 𝙒𝙚𝙡𝙘𝙤𝙢𝙚 𝙩𝙤 𝙢𝙮 𝘿𝙞𝙜𝙞𝙩𝙖𝙡 𝙒𝙤𝙧𝙡𝙙! ✨ 🚀\n\nHey there! 👋 Thank you for reaching out. \n\n🧑‍💻 I am a professional **Web, App, and Game Developer**. Aapka koi idea hai jise reality me badalna hai? Let's make it happen! 🌐📱🎮\n\n⚡ **𝘚𝘦𝘳𝙫𝘪𝘤𝘦𝘴 𝘐 𝘖𝘧𝘧𝘦𝘳:**\n👉 High-Quality Web Development 💻\n👉 Android/iOS Mobile Apps 📲\n👉 Custom Game Development (Android/PC) 🕹️\n👉 Bug Fixes & UI/UX Improvements 🛠️\n\nDrop your requirements or project details here. Main jald se jald aapko reply karunga! 🤝\n\n💥 *Let's build something epic together!* 💥`;

    function log(message) {
        const logArea = document.getElementById('logArea');
        const time = new Date().toLocaleTimeString();
        logArea.innerHTML += `<div>[${time}] ${message}</div>`;
        logArea.scrollTop = logArea.scrollHeight;
    }

    async function startBot() {
        const tokenInput = document.getElementById('botToken').value.trim();
        if (!tokenInput) {
            alert("Please enter a valid Bot Token!");
            return;
        }

        botToken = tokenInput;
        isPolling = true;

        document.getElementById('startBtn').style.display = 'none';
        document.getElementById('stopBtn').style.display = 'block';
        document.getElementById('botToken').disabled = true;

        log("Checking token validity...");
        try {
            const checkRes = await fetch(`https://api.telegram.org/bot${botToken}/getMe`);
            const botInfo = await checkRes.json();
            
            if (!botInfo.ok) {
                log("<span style='color:red'>Error: Invalid Token! Stopping.</span>");
                stopBot();
                return;
            }
            log(`Success! Connected as @${botInfo.result.username}`);
            log("Listening for /start commands... (Don't close this tab)");
            
            // Start polling loop
            pollUpdates();
        } catch (error) {
            log("<span style='color:red'>Network error! Check your connection.</span>");
            stopBot();
        }
    }

    function stopBot() {
        isPolling = false;
        document.getElementById('startBtn').style.display = 'block';
        document.getElementById('stopBtn').style.display = 'none';
        document.getElementById('botToken').disabled = false;
        log("Bot stopped. Live polling ended.");
    }

    async function pollUpdates() {
        if (!isPolling) return;

        try {
            const response = await fetch(`https://api.telegram.org/bot${botToken}/getUpdates?offset=${updateId + 1}&timeout=10`);
            const data = await response.json();

            if (data.ok && data.result.length > 0) {
                for (let update of data.result) {
                    updateId = update.update_id; // Update offset

                    if (update.message && update.message.text === '/start') {
                        const chatId = update.message.chat.id;
                        const firstName = update.message.from.first_name;
                        log(`Received /start from ${firstName}. Sending welcome message...`);
                        
                        await sendMessage(chatId, welcomeMessage);
                    }
                }
            }
        } catch (error) {
            console.error("Polling error:", error);
        }

        // Loop the function again if still running
        if (isPolling) {
            setTimeout(pollUpdates, 1500); 
        }
    }

    async function sendMessage(chatId, text) {
        try {
            const url = `https://api.telegram.org/bot${botToken}/sendMessage`;
            const payload = {
                chat_id: chatId,
                text: text,
                parse_mode: "Markdown"
            };

            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            
            const result = await response.json();
            if(result.ok) {
                log(`Message successfully sent to chat ID: ${chatId}`);
            } else {
                log(`<span style='color:red'>Failed to send message: ${result.description}</span>`);
            }
        } catch (error) {
            log("<span style='color:red'>Error sending message!</span>");
        }
    }
</script>

</body>
            </html>
